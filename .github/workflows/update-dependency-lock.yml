name: Apply safe dependency fixes

on:
  push:
    branches:
      - chore/dependency-security-cleanup
    paths:
      - .github/workflows/update-dependency-lock.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only || true

      - name: Show production audit after safe fixes
        run: npm audit --omit=dev || true

      - name: Show full audit after safe fixes
        run: npm audit || true

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No safe lockfile changes to commit."
            exit 0
          fi
          git commit -m "Apply safe dependency audit fixes"
          git push origin HEAD:chore/dependency-security-cleanup
