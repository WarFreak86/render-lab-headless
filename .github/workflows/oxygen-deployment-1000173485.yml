name: Storefront 1000173485
on: [push]

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    name: Quality gate and deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Update GraphQL Codegen security baseline
        id: dependency-update
        if: github.ref_name == 'dependency-security-maintenance'
        run: |
          npm install --save-dev --save-exact @graphql-codegen/cli@7.4.0
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Update GraphQL Codegen security baseline"
            git push origin HEAD:dependency-security-maintenance
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Production dependency audit inventory
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Full dependency audit inventory
        continue-on-error: true
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Restore generated type artifacts
        run: git checkout -- storefrontapi.generated.d.ts customer-accountapi.generated.d.ts

      - name: Verify clean working tree
        run: git diff --exit-code

      - name: Build and Publish to Oxygen
        if: steps.dependency-update.outputs.updated != 'true'
        run: npx shopify hydrogen deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000173485 }}
