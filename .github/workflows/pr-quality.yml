name: Pull request quality checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (no deploy)
        run: npm run build

      # Temporary PR #78 review deployment. The --preview flag explicitly
      # prevents this workflow from deploying to Oxygen Production.
      # Remove this step after validation, before merging the PR.
      - name: Deploy PR #78 to Oxygen Preview
        if: ${{ github.event.pull_request.number == 78 && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000173485 }}
        run: |
          if [ -z "$SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN" ]; then
            echo "Missing Oxygen deployment token: preview deployment skipped"
            exit 1
          fi
          # Codegen in typecheck/build changes the tracked generated d.ts; restore
          # only generated artifacts before the clean-tree deployment guard.
          git checkout -- storefrontapi.generated.d.ts customer-accountapi.generated.d.ts
          npx shopify hydrogen deploy --preview --metadata-description "Render-Lab Apparel PR 78 review"
