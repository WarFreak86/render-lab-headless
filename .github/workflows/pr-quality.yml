name: Pull request quality checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (no deploy)
        run: npm run build

      # Temporary isolated PR #79 preview; do not publish production.
      - name: Deploy cart discount QA to Oxygen Preview
        if: ${{ github.event.pull_request.number == 79 && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000173485 }}
        run: |
          test -n "$SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN"
          git checkout -- storefrontapi.generated.d.ts customer-accountapi.generated.d.ts
          npx shopify hydrogen deploy --preview --auth-bypass-token --metadata-description "PR 79 discount total in cart drawer"

      - name: Verify private cart preview route
        if: ${{ github.event.pull_request.number == 79 && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          export DEPLOYMENT_URL="$(jq -r '.url // empty' h2_deploy_log.json)"
          export AUTH_BYPASS_TOKEN="$(jq -r '.authBypassToken // empty' h2_deploy_log.json)"
          test -n "$DEPLOYMENT_URL"
          test -n "$AUTH_BYPASS_TOKEN"
          curl --fail --silent --show-error --location \
            --header "oxygen-auth-bypass-token: $AUTH_BYPASS_TOKEN" \
            "$DEPLOYMENT_URL/cart" --output /tmp/cart-preview.html
          grep -qi 'Your cart' /tmp/cart-preview.html
          echo "PASS private cart route HTTP 200 with expected content"
